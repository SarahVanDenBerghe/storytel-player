# iPhone remote for the Mac app: a Lock Screen card (Live Activity) whose buttons
# reach src/modules/remote.ts over Wi-Fi without unlocking the phone.
# Generate the Xcode project with `xcodegen` in this folder.
name: StorytelRemote
options:
  bundleIdPrefix: io.github.sarahvandenberghe
  deploymentTarget:
    iOS: "17.0"
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  StorytelRemote:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: StorytelRemoteWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sarahvandenberghe.storytelremote
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Storytel Remote
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        NSLocalNetworkUsageDescription: Sends play, pause, skip and speed commands to Storytel Companion on your Mac.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  StorytelRemoteWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.sarahvandenberghe.storytelremote.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Storytel Remote
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
